# TLS'siz sunum — yerel yığın ve web imajının gömülü varsayılanı. Üretimde
# PCB'nin nginx.prod.conf'una karşılık gelen bir üst katman platform
# deposunda eklenecek (bkz. alp-platform CLAUDE.md → Faz 4 notu).
#
# DİKKAT — nginx'te `add_header` MİRAS ALINMAZ: bir `location` kendi
# `add_header`'ını yazdığı anda üst seviyedekilerin HEPSİ o konumda düşer.
# Bu yüzden güvenlik başlıkları, kendi başlığı olan her konumda tekrarlanır.
# (Desen alp-pcb-toolkit/web/nginx.conf ile birebir aynı — orada ölçülmüş
# bir davranış.)

server {
    # IPv6 de açık: konteyner içinde `localhost` önce ::1'e çözülür ve
    # yalnızca IPv4 dinlenirse sağlık kontrolü "connection refused" alır.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # Edge, süit önekini KORUYARAK vekilliyor (/comm/... aynen buraya gelir),
    # ama diskte /comm/ alt dizini yok — dosyalar kökte. Tek satır rewrite bunu
    # location eşleşmesinden ÖNCE (nginx'te rewrite fazı location seçiminden
    # önce çalışır) çözer; aşağıdaki her location'ı ayrı ayrı /comm/ önekiyle
    # yeniden yazmaya gerek YOKTUR. Yalnız /comm/ ile başlayan istekleri
    # etkiler — konteyner içi /healthz kontrolü önek taşımaz, dokunulmaz.
    # (Desen alp-pcb-toolkit/web/nginx.conf ile aynı.)
    rewrite ^/comm/(.*)$ /$1 break;

    # Konteyner sağlık kontrolü — SPA geri düşüşünden ÖNCE gelmeli, yoksa
    # index.html döner ve kontrol her zaman "sağlıklı" görünür.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Statik varlıklar ----
    # Vite dosya adına içerik hash'i basar (assets/index-a1b2c3.js), bu yüzden
    # içerik değiştiğinde ad da değişir — süresiz önbellek güvenlidir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # ---- HTML kabuğu + SPA geri düşüşü ----
    # Comm PCB'nin aksine prerender YAPMAZ (tek `index.html` kabuğu, 172
    # protokol sayfası tamamen istemci tarafında render edilir) — bu yüzden
    # PCB'deki çok adımlı try_files zinciri (…/spa-fallback.html) burada
    # gereksiz: her bilinmeyen yol doğrudan index.html'e düşer.
    #
    # CSP script-src: index.html'de TEK bir satır içi <script> var (tema
    # ön-boyama, FOUC önleme — main.tsx yüklenmeden önce senkron çalışmak
    # ZORUNDA, bkz. index.html yorumu). 'unsafe-inline' yerine bu scriptin
    # TAM içeriğinin SHA-256 hash'i verildi — daha dar. Script içeriği
    # değişirse (index.html'deki <script> bloğu) bu hash de DERLENMİŞ
    # dist/index.html'den yeniden hesaplanıp güncellenmeli, yoksa tarayıcı
    # scripti sessizce engeller ve tema önce yanlış açılır.
    # style-src'de 'unsafe-inline' YOK: repo'da `style={{...}}` veya
    # `dangerouslySetInnerHTML` kullanımı yok (denetlendi); biri eklenirse bu
    # satır da genişletilmeli.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-k3Z5QzTKrGOYYMOHKu3+Ua/6x7kYGx2C2of3+smCd6U='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /index.html;
    }
}
